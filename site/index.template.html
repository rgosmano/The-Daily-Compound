<!doctype html>
<html lang="en" data-root="{{ROOT}}" data-date="{{DATE}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action https://buttondown.com; base-uri 'none'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESC}}">

  <link rel="icon" href="{{ROOT}}assets/favicon.svg" type="image/svg+xml">

</head>
<body>

  <div id="progress" aria-hidden="true"><div id="progress-bar"></div></div>
  <div class="layout">
    <aside id="sidebar" aria-label="Progress and archive"></aside>
    <main id="main" tabindex="-1">
{{PREVIEW}}
    </main>
  </div>
  <script src="{{ROOT}}editions/site.js"></script>
  <script src="{{ROOT}}editions/manifest.js"></script>
  <script src="{{ROOT}}assets/app.js"></script>
